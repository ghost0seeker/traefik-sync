services:
  app1:
    image: alpine/socat
    command: tcp-listen:80,fork,reuseaddr exec:"echo -e 'HTTP/1.1 200 OK\r\n\r\nHello from App 1!'"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app1.rule=Host(`app1.localhost`)"
      - "traefik.http.routers.app1.entrypoints=web"
      - "traefik.http.routers.app1.tls=true"
      - "traefik.http.services.app1.loadbalancer.server.port=80"

  # Container 2: app2.localhost
  app2:
    image: alpine/socat
    # Listens on port 80 and returns a simple plain text response
    command: tcp-listen:80,fork,reuseaddr exec:"echo -e 'HTTP/1.1 200 OK\r\n\r\nHello from App 2!'"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app2.rule=Host(`app2.localhost`)"
      - "traefik.http.routers.app2.entrypoints=web"
      - "traefik.http.routers.app2.tls=true"
      - "traefik.http.services.app2.loadbalancer.server.port=80"
